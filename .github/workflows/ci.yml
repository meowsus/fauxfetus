name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # Cancel in-progress runs for the same ref. Renovate rebases often, so this
  # avoids wasting CI minutes on superseded PR runs.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # setup-node MUST run before pnpm/action-setup. pnpm 11 self-installs via
      # Node and requires Node >=22.13; the runner's default is Node 20.
      # Note: do NOT enable caching here. setup-node v5 defaults to
      # `package-manager-cache: true` and tries to invoke pnpm to compute the
      # cache key, but pnpm isn't on PATH yet at this step.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - uses: pnpm/action-setup@v4
        with:
          # Read the pinned pnpm version from package.json's `packageManager` field.
          # This is the default but spelled out for clarity.
          package_json_file: package.json

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json

      - run: pnpm install --frozen-lockfile

      - run: pnpm build
