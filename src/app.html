<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#0e0f13" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<link
			rel="preload"
			href="/fonts/instrument-serif-roman.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<link
			rel="preload"
			href="/fonts/space-grotesk-variable.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<link rel="apple-touch-icon" href="/icons/icon-180x180.png" />
		<link
			rel="alternate"
			type="application/rss+xml"
			title="Faux Fetus news"
			href="https://fauxfetus.net/news/feed.xml"
		/>

		<!-- Analytics. Versioned v5 script = immutable upstream, so the SRI hash
		     can never break. If a future version is wanted, get the new pair from
		     https://www.goatcounter.com/help/countjs-versions -->
		<script
			data-goatcounter="https://fauxfetus.goatcounter.com/count"
			async
			src="https://gc.zgo.at/count.v5.js"
			crossorigin="anonymous"
			integrity="sha384-atnOLvQb9t+jTSipvd75X2yginT4PjVbqDdlJAmxMm+wYElFmeR6EmLP5bYeoRVQ"
		></script>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
